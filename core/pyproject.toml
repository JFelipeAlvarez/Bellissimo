[project]
name = "bellissimo-core"
version = "0.1.0"
description = "Núcleo de Bellissimo: modelos de la carta, validación y reglas de negocio."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    # Base de datos de zonas horarias. Windows no la trae, y sin ella
    # zoneinfo no puede saber qué hora es en America/Bogota.
    "tzdata>=2024.1",
]

[project.scripts]
bellissimo = "bellissimo_core.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bellissimo_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errores básicos · I: orden de imports · B: bugs comunes · UP: sintaxis moderna · SIM: simplificaciones
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
