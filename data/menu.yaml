        descripcion: Relleno de salsa boloñesa con champiñón.
      - id: panino-del-nonno
        nombre: Panino del nonno
        precio: 12000
        descripcion: Trozos de pollo bañados en salsa Bellissimo.
      - id: panino-panceta
        nombre: Panino de panceta
        precio: 12000
        descripcion: Jugosa panceta bañada en salsa napolitana.
      - id: panino-vegetariano
        nombre: Panino vegetariano
        precio: 12000
