# ─────────────────────────────────────────────────────────────────────────────
#  CARTA DE BELLISSIMO · Única fuente de verdad (ver docs/adr/0001)
#
#  Reglas para editar este archivo:
#  - Los precios van en pesos colombianos, como número entero y sin puntos:
#    13000, no 13.000 ni "13.000".
#  - Cada plato tiene un `id` único, en minúsculas y con guiones, sin tildes:
#    ravioli-carne. El id no se muestra al cliente; sirve para identificar el
#    plato en el sistema, así que no lo cambies aunque cambies el nombre.
#  - La indentación (los espacios a la izquierda) importa. Usa siempre 2 espacios.
#  - Después de editar, valida con:  cd core && uv run bellissimo validar
# ─────────────────────────────────────────────────────────────────────────────

restaurante:
  nombre: Bellissimo
  lema: Pastas para sorprender
  descripcion: Pasta fresca artesanal · Producción propia
  direccion: "Calle 8 # 4-51"
  whatsapp: "573150336914"        # con indicativo del país, solo números
  instagram: bellissimo.pastas
  zona_horaria: America/Bogota
  alergenos: >-
    Nuestros productos contienen o pueden contener gluten (trigo), huevo,
    leche y derivados lácteos. Algunas preparaciones incluyen carne de res o
    pollo. Si eres alérgico a algún alimento, infórmalo a nuestro personal
    antes de ordenar.

# Horario de atención. Un día sin horario (null) significa cerrado.
horario:
  lunes:     { abre: "12:30", cierra: "20:00" }
  martes:    null
  miercoles: { abre: "12:30", cierra: "20:00" }
  jueves:    { abre: "12:30", cierra: "20:00" }
  viernes:   { abre: "12:30", cierra: "20:00" }
  sabado:    { abre: "12:30", cierra: "20:00" }
  domingo:   { abre: "12:30", cierra: "19:00" }

# ── Arma tu pasta ────────────────────────────────────────────────────────────
# El cliente elige una pasta y, si quiere, una salsa y una proteína.
# El precio del plato es la suma de lo que elige.
arma_tu_pasta:
  incluye: pan y queso parmesano

  pastas:
    - nombre: Ravioli
      platos:
        - id: ravioli-carne
          nombre: Ravioli de carne
          precio: 13000
          descripcion: Carne de res seleccionada.
        - id: ravioli-4-quesos
          nombre: Ravioli de 4 quesos
          precio: 13000
          descripcion: Ricota, campesino, azul y parmesano.
        - id: ravioli-pollo
          nombre: Ravioli de pollo
          precio: 13000
          descripcion: Mezcla de pechuga de pollo.
        - id: ravioli-queso-espinaca
          nombre: Ravioli de queso y espinaca
          precio: 13000
          descripcion: Queso fresco y espinaca.
        - id: ravioli-ricota-nuez
          nombre: Ravioli de ricota y nuez
          precio: 13000
          descripcion: Ricota y trozos de nuez.
        - id: ravioli-salmon
          nombre: Ravioli de salmón
          precio: 18000

    - nombre: Pastas largas
      platos:
        - id: fettuccine-huevo
          nombre: Fettuccine al huevo
          precio: 7000
        - id: fettuccine-cafe
          nombre: Fettuccine de café
          precio: 7000
        - id: fettuccine-tinta-calamar
          nombre: Fettuccine tinta de calamar
          precio: 7500
        - id: linguine-huevo
          nombre: Linguine al huevo
          precio: 7000
        - id: linguine-mixto
          nombre: Linguine mixto
          precio: 7000
          descripcion: Zanahoria, espinaca y remolacha.
        - id: spaguetti
          nombre: Spaguetti
          precio: 7000

  salsas:
    - nombre: Rojas
      color: roja
      platos:
        - id: salsa-napolitana
          nombre: Napolitana
          precio: 10000
          descripcion: Tomate, zanahoria, cebolla, apio y hierbas.
        - id: salsa-bolonesa
          nombre: Boloñesa
          precio: 10000
          descripcion: Carne de res, tomate y vegetales a fuego lento.
        - id: salsa-amatriciana
          nombre: Amatriciana
          precio: 10000
          descripcion: Trozos de tomate maduro y albahaca.

    - nombre: Blancas
      color: blanca
      platos:
        - id: salsa-bellissimo
          nombre: Bellissimo
          precio: 10000
          descripcion: Crema de leche, napolitana, tocineta y pollo.
          de_la_casa: true
        - id: salsa-alfredo
          nombre: Alfredo
          precio: 10000
          descripcion: Crema, mantequilla, queso, tocineta y nueces.
        - id: salsa-carbonara
          nombre: Carbonara
          precio: 10000
          descripcion: Crema, mantequilla, tocineta y yemas de huevo.
        - id: salsa-4-quesos
          nombre: 4 quesos
          precio: 10000
          descripcion: Mezcla cremosa de quesos seleccionados.
        - id: salsa-champinon
          nombre: Champiñón
          precio: 10000
        - id: salsa-camaron
          nombre: Camarón
          precio: 15000

    - nombre: Verde
      color: verde
      platos:
        - id: salsa-pesto
          nombre: Pesto
          precio: 10000

  proteinas:
    - id: albondigas-carne
      nombre: Albóndigas de carne
      precio: 15000
    - id: albondigas-queso-espinaca
      nombre: Albóndigas de queso y espinaca
      precio: 15000
    - id: milanesa-pollo
      nombre: Milanesa de pollo
      precio: 16000
    - id: ossobuco
      nombre: Ossobuco
      precio: 16000
    - id: callos-antonieta
      nombre: Callos Antonieta
      precio: 16000
    - id: salmon
      nombre: Salmón
      precio: 19000
    - id: salchichas-italianas
      nombre: 2 salchichas italianas
      precio: 19000

# ── Secciones de la carta ────────────────────────────────────────────────────
# Cada sección tiene `platos` directamente, o `grupos` con sus propios platos
# (como Bebidas). Nunca las dos cosas a la vez.
secciones:
  - id: horno
    titulo: Lasañas y canelones
    nota: Pasta fresca en capas, gratinada con queso.
    incluye: pan
    platos:
      - id: lasana-ferrara
        nombre: Lasaña Ferrara
        precio: 20000
        descripcion: Carne de res, cerdo y chorizo, salsa napolitana, bechamel y queso gratinado.
      - id: lasana-piamonte
        nombre: Lasaña Piamonte
        precio: 20000
        descripcion: Pollo desmechado, tocineta, jamón, champiñón, bechamel, salsa napolitana y queso gratinado.
      - id: lasana-vegetariana
        nombre: Lasaña vegetariana
        precio: 20000
        descripcion: Zanahoria, espinaca, champiñón, zucchini, ricota, bechamel, salsa napolitana y queso gratinado.
      - id: lasana-capri
        nombre: Lasaña Capri
        precio: 25000
        descripcion: Salmón, espinaca, bechamel, salsa napolitana y queso gratinado.
      - id: canelon-mixto
        nombre: Canelón mixto
        precio: 20000
        descripcion: Dos rollos de pasta, uno relleno de carne y otro de pollo con jamón, con salsa napolitana, bechamel y queso gratinado.

  - id: entradas
    titulo: Entradas
    nota: Paninos en pan de masa madre, cubiertos con queso mozzarella.
    platos:
      - id: panino-cuori-di-ragu
